<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Jet d’Encre Éditions — Revenir à l’accueil">
        <img class="brand-logo" src="assets/brand/jet-dencre-logo-horizontal.webp" alt="Jet d’Encre Éditions">

      </button>
      <div class="topbar-right">
        <div id="headerStatus"></div>
        <button id="teacherDeskTrigger" class="teacher-desk-trigger" type="button" data-action="toggle-teacher-desk" aria-controls="teacherDesk" aria-expanded="false" hidden>Pupitre professeur</button>
        <span class="prototype-badge">Prototype V0.3</span>
      </div>
    </header>
    <div id="app" class="app-view">
      <section class="loading-card" aria-live="polite">
        <img class="loading-logo" src="assets/brand/jet-dencre-monogram.webp" alt="">
        <h1>Préparation du jeu…</h1>
        <p>Chargement des cartes A1 à B2.</p>
      </section>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
